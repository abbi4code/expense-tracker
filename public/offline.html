<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f6f4ef" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#0e0e10" media="(prefers-color-scheme: dark)" />
  <title>You're offline</title>
  <style>
    :root { --bg:#f6f4ef; --ink:#161513; --muted:#6b6760; --surface:#fff; --line:#e6e2da; color-scheme: light dark; }
    @media (prefers-color-scheme: dark) { :root { --bg:#0e0e10; --ink:#f3f1ec; --muted:#a3a09a; --surface:#17171a; --line:#28282d; } }
    * { box-sizing: border-box; }
    html, body { margin:0; height:100%; background:var(--bg); color:var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
    main { min-height:100dvh; display:flex; flex-direction:column; align-items:center; justify-content:center;
      gap:12px; padding:24px; text-align:center; }
    .emoji { font-size:44px; width:88px; height:88px; display:grid; place-items:center; border-radius:28px;
      background:var(--surface); border:1px solid var(--line); margin-bottom:8px; }
    h1 { font-size:22px; margin:0; letter-spacing:-0.02em; }
    p { margin:0; color:var(--muted); max-width:280px; line-height:1.5; }
    button { margin-top:16px; height:48px; padding:0 24px; border-radius:999px; border:0; font:inherit; font-weight:600;
      background:var(--ink); color:var(--bg); }
  </style>
</head>
<body>
  <main>
    <div class="emoji">📡</div>
    <h1>You're offline</h1>
    <p>This page isn't saved on your phone yet. Reconnect and try again.</p>
    <button onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
